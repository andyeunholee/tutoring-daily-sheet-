name: Prepare parent drafts

# Run by hand from the Actions tab. There is no schedule: the director decides
# when drafts are worth preparing.
on:
  workflow_dispatch:

jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only what this job needs; the Streamlit apps are not involved here.
      - run: pip install google-api-python-client google-auth python-dotenv

      - name: Write the service account key
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Prepare the drafts
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          REPORTS_SPREADSHEET_ID: ${{ secrets.REPORTS_SPREADSHEET_ID }}
          STUDENTS_SPREADSHEET_ID: ${{ secrets.STUDENTS_SPREADSHEET_ID }}
        run: python daily_drafts.py

      - name: Remove the key
        if: always()
        run: rm -f service_account.json
