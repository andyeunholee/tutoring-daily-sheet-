name: Daily review reminder

on:
  schedule:
    # GitHub runs cron in UTC, and 11:00 in America/New_York is 15:00 UTC on
    # daylight time but 16:00 UTC on standard time. Fire on both and let
    # daily_reminder.py check the local clock and skip the wrong one.
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:        # run it by hand from the Actions tab

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only what the reminder needs; the Streamlit apps are not involved here.
      - run: pip install google-api-python-client google-auth python-dotenv

      - name: Write the service account key
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Send the reminder
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          REPORTS_SPREADSHEET_ID: ${{ secrets.REPORTS_SPREADSHEET_ID }}
          STUDENTS_SPREADSHEET_ID: ${{ secrets.STUDENTS_SPREADSHEET_ID }}
        # A manual run means "I want to see it now", so skip the clock check.
        run: python daily_reminder.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Remove the key
        if: always()
        run: rm -f service_account.json
