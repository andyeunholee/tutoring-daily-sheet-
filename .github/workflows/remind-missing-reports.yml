name: Remind teachers of missing reports

# Switched off on 2026-09-09 at the director's request: teachers are not to
# receive these for now. Manual runs still work; uncomment to resume.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/15 * * * *"

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install google-api-python-client google-auth python-dotenv

      - name: Write the service account key
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Check the calendar and nudge
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          REPORTS_SPREADSHEET_ID: ${{ secrets.REPORTS_SPREADSHEET_ID }}
          STUDENTS_SPREADSHEET_ID: ${{ secrets.STUDENTS_SPREADSHEET_ID }}
        run: python remind_missing_reports.py

      - name: Remove the key
        if: always()
        run: rm -f service_account.json
